lang: zh
keep_mark: "【措辞已确认，保留原文】"
header: "措辞检查：下面这些词常被用得含糊，请逐条看看有没有更好的说法。"
feedback_prefix: "措辞检查："
term_open: "「"
term_close: "」"
term_sep: "、"
term_heading: "■ {words}（{level_label}）"
lines_heading: "命中位置："
line_item: "  - 第 {line} 行（{words}）：{context}"
actions_heading: "各级处理方式："
action_item: "  - {level_label}：{value}"
fields:
  why: "  问题：{value}"
  ok_when: "  可以保留：{value}"
  bad_when: "  需要改写：{value}"
  suggest: "  建议：{value}"
level_labels:
  1: 最好修改
  2: 看语境
  3: 补充说明
  0: 放行
level_actions:
  1: "默认换成具体说法；只有符合判断原则第 1、2 条才保留"
  2: "对照「可以保留」「需要改写」判断"
  3: "这个词可以用；读者可能不懂时，在第一次出现处补一句解释（可参考建议）"
guide: |-
  这些词不是禁用词，只是常被用得含糊。请对每一处想一下：有没有让读者更容易懂的说法？
  判断原则：
  1. 在引号里讨论这个词本身、引用别人的原文、专有名词或产品名 → 保留。
  2. 用户在对话里先用过这个词，或者读者从上下文能明确看出它具体指什么 → 保留。
  3. 一句话里堆了好几个这类词 → 改写。
  4. 每个词标题括号里是它的级别，按「各级处理方式」里对应的一条处理。
  5. 改写时写出具体的动作、对象和结果，不要换个同样空的近义词，也不要为了避开该词而删掉原有的前提条件或事实信息；找不到更好的说法就保留。

  处理方式：
  - 有需要改写的：只改命中处，不要改动未命中的句子；把修改后的完整回复重新输出，不要解释改了哪些词。
  - 全部应该保留：只回复一行「{keep_mark}」，不要重复原文。
confirm:
  heading: "补充确认（以下术语今日已命中达到阈值，请询问用户是否要加入其本地知识库，同意后再记入并放行）："
  item: "- 「{term}」（今日第 {count} 条回复命中）：请在回复末尾简短解释它的含义，并询问用户是否已经理解、要不要将「{term}」加入本地知识库（后续不再提示）；不要自行假定用户已理解。"
  suggest: "  参考解释：{value}"
  command: "  仅当用户明确回复同意加入本地知识库后，再执行：`{cmd}`。"
  decline_command: "  如果用户不愿意加入，执行：`{cmd}`（重置该词的提醒计数，不再追问，不影响日志统计）。"
replay_prompt: |-
  [对话记录]
  用户：{user}

  你（上一条回复）：
  {reply}

  [Stop hook 反馈，回复结束前必须处理]
  {reason}
