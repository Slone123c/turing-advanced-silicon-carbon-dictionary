# 级别：1 最好修改 / 2 看语境 / 3 补充说明 / 0 放行（挡住子串误命中）
lang: zh
rules:
  1:
  - term: 落地
    why: 空泛动词或修饰语，看不出具体做了什么、改在哪里；「分层落地」「落地闭环」更空
    suggest: 写出具体动作或产物：实现某功能、写入某配置、合入代码、文档或方案定稿、发布规范；「已落地」写为已完成、已生效或已提交；「落地优先级 / 可落地」写为实施优先级、可直接采用或可实现
  - term: 回派
    why: 内部协作黑话
    suggest: 退回给原负责人（或对应同事）继续处理
  - term: 解锁
    why: 常把满足前置条件、开放功能或允许进入下一阶段说成游戏式的「解锁」
    suggest: 肯定句写为满足某条件后可开始下一阶段、开放某功能、展开下一层内容；否定句写为还不满足某条件、暂不能开始；指账号锁定后的恢复操作或机械装置时写为解除锁定、释放锁或放行
  - term: 兜底
    why: 中文技术说明中像行话；即使策略明确，也优先直接说明失败时怎么处理
    suggest: 按原意写为备用方案、默认处理，或直接写失败时返回什么、改用什么
  - term: 贯通
    aliases:
    - 打通
    why: 空动作
    suggest: 写出接通了哪两个系统/接口，从哪一步到哪一步
  - term: 范式
    aliases:
    - 方法论
    why: 空包装
    suggest: 说具体做法
  - term: 主路径
    aliases:
    - 关键路径
    why: 笼统代指首选方案、代码默认分支、核心业务流程或基本功能，读者需要猜具体指哪一种
    suggest: 指方案取舍时写为首选方式、默认做法；指代码逻辑时写为正常分支、默认读取方式；指业务流程或核心功能时写出具体步骤（如启动、写入配置与恢复等基本功能）
  - term: 联动
    why: 笼统表示多处一起变化或多个模块配合，不说清谁触发谁、怎么配合
    suggest: 写出具体触发和配合关系：点击某处时同步更新某处，或某服务配合某服务完成某操作
  - term: 沉淀
    why: 空动作
    suggest: 写进文档、记录到知识库或存进某张表里
  - term: 收口
    why: 本意结项/关缺陷；日常还常用来指统一入口、下线旧路径、统一规则或文档定稿，读者看不出具体动作；「把逻辑收口」像物理操作
    suggest: 按实际动作写为统一入口、下线旧路径、统一规则、整理定稿、处理完毕、先告一段落或关掉缺陷
  - term: 补一刀
    why: 听着像砍人；实际是再加一点逻辑或打补丁
    suggest: 再补一段逻辑 / 再打一个补丁
  - term: 修掉
    why: 防御型口头禅；「把场景修掉」像消灭场景
    suggest: 修好这个 bug / 补上这种情形的处理
  - term: 烟测
    why: smoke test 切口；口语里像黑话
    suggest: 写全称「冒烟测试」，或说明只检查了哪些基本功能
  - term: 冒烟
    why: 把「冒烟测试」口语简写为「冒烟」，夹在句子里生硬且表意不全
    suggest: 写全称「冒烟测试」，或直接写出检查哪几项基本功能（如启动、登录、写入配置是否正常）
  - term: 硬事实
    why: 思维链黑话；常只是「已核实的事实」
    suggest: 已核实：… / 目前能确认的是…
  - term: 两条线拆开
    why: 思维链黑话；像在画图
    suggest: 分成两件事分别说 / 先讲 A 再讲 B
  - term: 再压一遍
    why: 思维链黑话；像工业工序
    suggest: 再检查一遍 / 再对照约束扫一遍
  - term: 无感
    why: 广告词；常指用户几乎察觉不到
    suggest: 用户几乎感觉不到 / 无需重启客户端 / 不打断当前操作
  - term: 动态插拔
    why: 硬件隐喻；常指运行时装卸模块
    suggest: 运行时加载/卸载插件（或模块），不必重启整个进程
  - term: 对齐口径
    why: 「对齐」+「口径」双油腻
    suggest: 统一某某的定义/说法，并写出统一成什么
  - term: 卡点
    why: 闯关隐喻
    suggest: 卡在等某某；缺什么就做不下去
  - term: 颗粒度
    why: 砂纸目数，不说单位
    suggest: 写出单位：拆到页面级还是字段级；按天还是按小时统计
  - term: 过单
    why: 敏捷切口
    suggest: 逐项核对工单、需求或清单
  - term: 文档门禁
    aliases:
    - 质量门禁
    why: 把进入下一阶段前必须具备的文档或质量检查叫作门禁，表达生硬
    suggest: 写出具体前提条件：没有需求文档就不开始设计，或未通过某项检查就不允许合并
  - term: 执行门禁
    why: 把并发互斥锁或执行前置条件叫作门禁，令人费解
    suggest: 直接说明限制条件：同一时间只允许一个任务运行，已有操作在执行时先等待其结束，或需先通过某权限校验与凭据检查才能执行
  - term: 工程资产
    why: AI 流程口头禅
    suggest: 把有用结论写回正式文档，下次还能用
  - term: 可运营
    why: 空泛形容词，既被用来指运营人员可自助操作，也被用来生硬翻译英文 operational（系统或环境可正常投入日常使用与维护）
    suggest: 指后台能力时写明运营人员能自己改什么配置、看什么报表；指环境或系统状态时写为可正常使用、能按流程日常发版与复测
  - term: 长出
    why: 英文直译（grow）
    suggest: 按实际过程写为新增、生成或逐步形成；只有程序自动生成时才写自动生成
  - term: 拉齐
    aliases:
    - 拉通
    why: 听起来像在扯绳子，其实是让各方知道同一件事
    suggest: 把 A/B/C 相关的人说到同一事实
  - term: 结论先行
    why: 听起来像咨询公司，其实是先说结论
    suggest: 结论：…；依据：…
  - term: 人力带宽
    why: 听起来像人是网线，其实是有没有空
    suggest: 还有多少人手或工时可用（如「这周还有没有人手接这个需求」）
  - term: 预期管理
    aliases:
    - 对齐预期
    why: 听起来像公关话术，其实是别让对方期望错
    suggest: 提前说清能做什么、做不到什么，以及大概什么时候能好
  - term: 心智
    why: 听起来像心理学讲座，其实是好不好懂/好不好记
    suggest: 用户能不能一眼看懂；要记多少规则
  - term: 抓手
    why: 听起来像体操，其实是能下手的切入点
    suggest: 具体从哪一步下手、能改什么（如「先把登录耗时降下来」）
  - term: 赋能
    why: 听起来像传销味，其实是帮某某更方便做
    suggest: 帮对方更方便地完成某件事，比如「让运营不用找研发就能自己导出报表」
  - term: 用户旅程
    why: 听起来像旅行社，其实是用户步骤/接触点
    suggest: 从打开 App 到付完款要经过哪些页；用户从进到完成目标的步骤
  - term: 精细化运营
    why: 听起来像空话，其实是分人群做不同动作
    suggest: 对沉默 7 天的用户发优惠券；按人群/场景做更细的运营动作
  - term: 组合拳
    why: 听起来像武打，其实是好几招一起上
    suggest: 同时做 A、B、C 三件事
  - term: 小步快跑
    why: 听起来像鸡汤，其实是短迭代
    suggest: 缩短迭代周期，先做最小可用版本验证想法（如「两周发一版，先验证核心流程」）
  - term: 平台化
    aliases:
    - 中台化
    - 线上化
    why: 听起来像战略幻灯片，其实是抽共用能力/搬到线上
    suggest: 把共用能力抽出来复用，或把手工表格/流程做成线上系统
  - term: 止血
    aliases:
    - 救火
    - 灭火
    why: 医疗/消防隐喻，说不清具体止住了什么
    suggest: 先把线上损失停住；写出关掉了哪个开关、回退了哪个版本
  - term: 协作协议
    why: 把文档抬成协议，易空
    suggest: 大家都按同一组文档理解目标和完成标准
  - term: 人机协作
    why: 时髦但不具体
    suggest: 说明人和 AI 各自负责哪部分（如人定目标与验收，AI 负责起草或补测试）
  - term: 触点
    why: 英文直译（touchpoint）
    suggest: 用户接触产品或服务的具体渠道、页面或环节，如通知邮件、注册页或客服咨询
  - term: 心智负担
    aliases:
    - 认知负荷
    why: 英文直译（cognitive load）
    suggest: 理解和使用时需要记住的信息、判断的规则或操作步骤；认知负荷在专业讨论中可保留并解释
  - term: 触达
    why: 英文直译（reach）
    suggest: 按实际动作写为发送通知、展示广告或联系用户；区分发送成功、用户收到与用户实际阅读
  - term: 唤端
    aliases:
    - 吊起
    why: 英文直译（deep link / open app）
    suggest: 从网页、消息或其他应用打开目标应用；跳转到特定页面时补充页面名称
  - term: 心智份额
    why: 英文直译（mind share）
    suggest: 用户想到某类需求时想起某品牌的程度；若指调查指标，说明实际调查和计算方法
  - term: 闭环运营
    why: 英文直译（closed-loop ops）
    suggest: 记录运营结果，并据此调整下一次行动；写清采取什么行动、观察什么结果、如何调整
  - term: 体感
    why: 互联网行话，借生理或气象词代指人的直观感受或使用体验
    suggest: 按实意写为实际感受、用起来的感觉，或直接写「用户几乎察觉不到」「肉眼看不出延迟」
  - term: 拉满
    aliases:
    - 打满
    why: 游戏与口语行话，常用来指占满宽度、用尽配额或达到上限
    suggest: 按实意写为占满整行、撑满容器宽度、跑满带宽或达到上限
  - term: 全绿
    aliases: [全套绿, 全部绿]
    why: 用测试绿灯代指「检查全部通过」，读者看不出具体跑了哪些检查
    suggest: 写出具体通过了什么，如「15 项测试全部通过」「构建和单元测试均已通过」；有没跑的检查也一并说明
  - term: 死门
    aliases: [死门归零]
    why: 生造词，读者看不出是指卡住的地方、走不通的分支还是别的问题
    suggest: 写出具体问题：哪几条路径走不通、被什么卡住，以及现在是否已解决
  - term: 终审干净
    why: 「干净」是英文 clean 的直译，没说检查了什么、有没有遗留问题
    suggest: 写为最终检查没有发现问题，或说明检查了哪些内容、还有什么没处理
  - term: 打回重判
    why: 把「退回重做、重新检查」压成四字口号，看不出退给谁、重做什么
    suggest: 写清退给哪一步或哪个人、需要改什么，以及改完后再检查什么
  - term: 单腿哑火
    why: 生造黑话；「单腿」指哪条路径、「哑火」是没触发还是没结果，读者只能猜
    suggest: 写出是哪一条检查或路径没有触发，或没有返回结果
  - term: 词义搬家
    why: 生造词，把「修改词义」「概念换了归属」拟人化，让人摸不着头脑
    suggest: 写为把某词的含义从 A 改成 B，或把某概念从 A 模块移到 B 模块
  - term: 实锤
    aliases: [打出实锤]
    why: 网络口语，只喊「确凿无疑」却不说依据是什么
    suggest: 写为已确认，并附上依据（如日志、复现步骤或测试结果）
  - term: 工程解法
    why: 「解法」带做题腔；「工程解法」用来代替方案、办法，套话味重
    suggest: 写为办法、方案或处理方式，并说明具体怎么做
  - term: 稳稳地接住
    aliases: [稳稳接住, 接住你]
    why: 英文 catch 的生硬直译加上刻意煽情，读起来油腻不自然
    suggest: 直接回应对方的问题，或说明接下来怎么处理
  - term: 我认
    aliases: [你认不认]
    why: 把「我同意 / 我承认」压成单字「认」，刻意装简练、带江湖气
    suggest: 直接写我同意、你说得对、这里确实有问题；询问对方时写为「你看这样合理吗」
  - term: 算一笔账
    aliases: [算笔账, 一笔一笔算]
    why: 不分场合（包括讨论代码、写小说）都说「算账」，带营销号和说教味，而且后面往往没有数字
    suggest: 直接给出成本、收益或具体数字；没有数字就删掉这句
  - term: 扎心
    why: 用情绪词铺垫「接下来很重要」，后面往往只是普通结论
    suggest: 直接写事实本身，不加「扎心的事实」这类情绪铺垫
  - term: 意外的真相
    aliases: [冷酷的真相]
    why: 先吊胃口再抛结论，后面往往只是普通事实
    suggest: 直接写结论；如果确实出乎意料，写出原本以为是什么、实际是什么
  - term: 非常漂亮
    aliases: [非常狠]
    why: 英文 nice / brilliant 的翻译腔夸奖，客套空洞；用「狠」夸人也显得夸张
    suggest: 具体说好在哪：解释了什么问题、省了什么步骤、避免了什么错误
  - term: 有意思的是
    aliases: [这就很有意思了, 这是一个很有意思的现象]
    why: 凑字数的过渡话，后面的内容通常并不特别，只是强行拔高
    suggest: 删掉前缀，直接写后面的内容；确有反差就写出反差在哪
  - term: 踩一下刹车
    aliases: [踩个刹车]
    why: 借开车打比方，拐弯抹角地表达「先别急、还有顾虑」
    suggest: 直接写先别急着这样做，或说明还有什么顾虑和原因
  - term: 更公正地说
    aliases: [更公平地说]
    why: 故作客观的过渡词，其实只是补充说明或改口
    suggest: 直接写要补充的内容（如「另一方面…」「更准确地说…」），不用自夸公正
  - term: 不吹不黑
    aliases: [不吹不捧, 不是我吹, 说句公道话, 平心而论, 实话实说, 讲真, 有一说一, 客观来说]
    why: 先给自己贴「客观中立」标签的口头禅，反而显得刻意
    suggest: 删掉前缀，直接给判断和依据
  - term: 一文看懂
    aliases: [一篇讲清, 一次讲透, 讲透, 吃透, 彻底搞懂, 彻底明白, 秒懂, 一网打尽, 看这一篇就够了, 手把手教你]
    why: 标题党式打包票（承诺「读完就全会」），或用「讲透 / 吃透」笼统代指理解程度，看不出具体掌握了什么
    suggest: 写清实际讲了哪几部分、能解决什么问题；正文里写明具体弄懂或确认了哪一点
  - term: 底层逻辑
    why: 互联网套话，空泛地暗示「背后有更深的道理」，却不说具体是什么
    suggest: 写出具体原理、机制或原因：为什么这样做、受什么条件限制
  - term: 认知觉醒
    aliases: [格局打开, 真正厉害的人, 拉开差距, 干货满满, 掏心窝, 越早明白越好, 后来才懂, 踩在实处, 踏实的底气, 真心建议]
    why: 成功学和鸡汤套话，假装真诚，实际没有具体信息
    suggest: 删掉空话，直接写具体建议和做法
  - term: 那么问题来了
    aliases: [你有没有想过, 敲重点, 划重点]
    why: 故弄玄虚的设问或喊口号式的强调，拖慢阅读节奏
    suggest: 删掉过渡套话，直接写出问题或重点内容
  - term: 破局
    aliases: [跃迁, 降维打击, 弯道超车, 认知升级, 高维视角, 蜕变, 升华]
    why: 空洞拔高的商业或成长大词，看不出实际做了什么
    suggest: 写出实际改了什么、效果是什么
  - term: 不躲不藏
    aliases: [不躲，不藏, 不躲、不藏, 不套模板, 不评判]
    why: 用「不…不…」排比给自己立真诚人设；嘴上说不套模板，这句本身就是模板
    suggest: 删掉表态铺垫，直接回答问题
  - term: 往下压一层
    why: 把深入分析说成物理动作，离开上下文看不出具体要查什么
    suggest: 写为进一步细分，或继续往深处排查具体原因
  - term: 跑通
    why: 常只笼统说「跑通了」，看不出实际执行了哪些步骤、结果对不对
    suggest: 写出具体执行了什么、拿到了什么结果（如「从登录到下单全流程测试通过」「脚本已成功跑完并生成结果」）
  - term: 拆解
    why: 常把简单的「分成几步」「分成几部分」包装成「拆解」
    suggest: 直接写分成哪几步、哪几部分，并列出来
  - term: 盘点
    why: 汇报套话，其实就是清点、列出来有哪些东西
    suggest: 直接写整理、列出目前有哪些内容
  - term: 严禁
    why: 训斥口吻，把普通的技术约束或注意事项说成纪律处分
    suggest: 直接写不要做什么、不能怎么做，并说明原因或后果
  - term: 静默
    aliases: [全日静默]
    why: 英文 silent / radio silence 直译；用来形容代码仓库无提交或功能未开发，易与「静默失败（silent failure）」混淆
    suggest: 按实意写为今日无新提交、尚无代码实现或暂无进展；若指 silent failure，直接写明失败时未报错
  - term: 钉死
    why: 英文 pin / pinning 直译并口语化扩展；用「钉死」代指固定版本、锁死地址或加测试约束，读者看不出具体用什么手段限制
    suggest: 按实际做法写为固定某版本或地址、锁定依赖，或通过自动化测试强制约束某行为
  - term: 实装
    why: 英文 implement / ship 直译，亦受日式汉字「実装」与游戏圈借词影响，在正式工程说明中生硬且含糊
    suggest: 按实际阶段写为正式实现、已合入代码、已上线或部署生效
  - term: 两臂
    why: 英文 two arms / dual-arm 隐喻直译；把两条并行工作线说成「两臂」，在中文里生硬费解
    suggest: 写为两条并行推进的工作线（或两个方向），并直接写出各自负责的内容
  - term: 加厚
    aliases: [加深, 加宽]
    why: 物理维度隐喻，部分受英文 thicken / deepen / widen（如 widen coverage / deepen testing）直译影响；只说「加厚」看不出具体补了什么
    suggest: 按实意写为补充测试用例、完善功能细节或扩大支持范围（字面尺寸或「加深理解」等日常用法除外）
  - term: 贴证
    aliases: [首跑贴证]
    why: 电报体压缩词，指附上实机运行截图、日志或验收记录，字面极易误解为「贴 SSL 证书」或「贴证件」
    suggest: 直接写附上运行截图、贴出日志输出或补充验收记录
  - term: 仍欠
    why: 电报体压缩词，省略了具体动作，看不出是还没写代码、未补测试还是缺少依赖
    suggest: 写为仍未完成、还缺少某项内容，并写明具体缺什么
  - term: 装成
    why: 电报体压缩词，把「安装成功 / 部署成功」压成两字，极易误读为「假装成」
    suggest: 写为安装成功、部署完成或已配置生效
  - term: 探针默藏
    why: 电报体四字压缩词，把「探针默认隐藏」压成生造词，初读不知所云
    suggest: 写全为探针默认隐藏，并按需说明在什么条件下显示
  - term: 听口
    why: 电报体压缩词，把「监听端口」硬压成两字，像方言黑话
    suggest: 写全称「监听端口」，或直接写出具体端口号
  - term: 首触
    why: 电报体压缩词，把「首次触发 / 首次接触」压成两字，读者需要猜主语和动作
    suggest: 写为首次触发、第一次执行或首次接触某功能
  - term: 定版
    why: 电报体压缩词，看不出是需求定稿、方案确认还是发布版本号已确定
    suggest: 按实际含义写为需求定稿、方案确认或确定发布版本号
  - term: 滚旧
    why: 电报体压缩词，把「回滚到旧版本」压成两字，生硬难懂
    suggest: 写全为回滚到旧版本，并写明回滚到哪个版本号
  - term: 上环境
    aliases: [上真机, 上节点, 上副本]
    why: 用泛化单字「上」替代具体运维动作，看不出是部署发布、同步配置、真机验证还是扩容加节点
    suggest: 写出具体动作：部署到某环境、安装到真机验证、新增节点或增加副本数
  - term: 出风险
    aliases: [出包]
    why: 用泛化单字「出」替代具体动作；「出风险」看不出是暴露风险还是引发故障，「出包」是口语切口
    suggest: 「出风险」写明可能暴露或引发什么具体问题；「出包」写为生成安装包或完成构建产物打包
  - term: 连修
    why: 电报体压缩词，只说「连修」看不出连续修了哪几个问题、各自改了什么
    suggest: 写为连续修复了以下问题，并逐项列出具体修复内容
  - term: 假绿
    aliases: [假干净]
    why: 测试切口，用「假绿 / 假干净」代指测试或检查表面通过但未覆盖真实逻辑，离开上下文不易理解
    suggest: 直说测试虽显示通过但未验证真实逻辑（或检查遗漏了某项问题），并写明漏测了什么
  - term: 第一刀
    aliases: [修了一刀]
    why: 借砍切动作代指第一阶段改造或局部修改，看不出具体做了哪一部分
    suggest: 写明第一阶段完成了哪些基础功能，或具体做了哪一处局部修改
  - term: 堵死
    aliases: [关死]
    why: 用夸张的物理封堵口吻代指彻底禁用、关闭入口或避免问题，表达情绪化且不说具体机制
    suggest: 按实意写为彻底禁用、关闭某入口、拦截某类请求或从根源避免某问题
  - term: 对表
    aliases: [可对表]
    why: 军事与协作黑话，把对照文档核对或按清单验收说成「对表」，读者看不出在对照哪份内容
    suggest: 写为对照某文档开始开发、按清单逐项验收，或与某方核对进度
  - term: 齐套
    aliases: [齐活]
    why: 制造业与口语黑话，只说「齐套 / 齐活」看不出具体哪些配套项已就绪
    suggest: 写为相关功能均已配套完成、所需依赖已全部就绪，并列出已完成的项
  - term: 私货
    why: 口语黑话，把各环境特有的差异化配置或夹带的非计划改动叫成「私货」，表意不准确
    suggest: 按实意写为环境特有配置、差异化参数或本次改动中夹带的额外修改
  - term: 种数据
    aliases: [种配置, 种假数据, 种 GeoIP]
    why: 用口语单字「种」代指预置、初始化或写入数据，非团队内部人士容易困惑
    suggest: 写为预置数据、写入初始配置或初始化 GeoIP 数据
  - term: 一把梭
    why: 口语黑话，用来指一次性全量改动或不做拆分的激进操作，看不出具体变更范围
    suggest: 写为一次性完成全部改动、合并为一个提交执行，并写明包含哪些步骤
  - term: 大补
    why: 口语黑话，用「大补」代指集中补充大量测试、修复或文档，看不出具体补了什么
    suggest: 写明具体补充了哪些测试、修复了哪些问题或完善了哪部分文档
  - term: 弄挂
    why: 口语黑话，用「弄挂」代指导致进程崩溃、服务不可用或任务卡死，表达不够准确
    suggest: 按实际现象写为导致服务崩溃、触发进程退出、引起超时或使界面卡死
  - term: 一条龙
    why: 口语套话，把端到端自动化脚本或连续流程说成「一条龙」，看不出包含哪几步
    suggest: 写出包含的具体步骤（如「自动完成构建、打包并部署到测试环境」）
  - term: 不前移
    why: 电报体压缩词，把「进度没有推进 / 停滞」压成生造词，读起来别扭
    suggest: 写为进度暂无推进、卡在某一步，并写明停滞原因
  - term: 进一格
    aliases: [补一块, 齐一截]
    why: 棋盘/拼图式隐喻，笼统表示「往前推了一点」却不说具体完成了什么
    suggest: 直接写出这一轮具体完成了哪个模块、补了哪项功能或解决了什么问题
  2:
  - term: 契约
    why: 英文 contract 直译，在中文技术说明中读起来生硬；即使含义明确，也优先用自然的中文
    suggest: 按实际所指写为接口约定、API 定义、字段与行为约定、配置文件校验规则、发布规范、.proto 与生成的接口代码、接口分界，或函数的参数与返回值要求；契约测试可写为接口约定测试
    ok_when: 法律或历史中的契约，或软件包名、规范章节等必须原样引用的正式名称
    bad_when: 把普通接口定义、字段格式、生成代码或函数调用要求统称为契约
  - term: 链路
    aliases:
    - 主链路
    - 主干链路
    - 全链路
    why: 常被泛化用来代指页面操作步骤、关联页面组、页面跳转过渡、发布流程或图上的连线；仅在网络通信和分布式调用追踪中自然
    suggest: 按实际所指写为操作流程、关联页面、页面跳转关系（如「列表 → 详情」）、发布流程、请求路径、上下游连线或代码实现；网络链路、调用链路保留并按需写明起止节点
    ok_when: 网络通信链路、分布式调用链路，或上下文已写明从哪一端到哪一端
    bad_when: 代指普通业务步骤、界面操作流程、关联页面、页面跳转过渡、CI/CD 发布流程，或空喊「全链路」
  - term: 闭环
    why: 管理隐喻；问题闭环/自检闭环/落地闭环到处用
    suggest: 写出起止步骤，或「做完并验证」
    ok_when: 读者已经知道指哪几步，或前文刚讲过从哪到哪
    bad_when: 没交代起点和终点，只当"做完了"的口号
  - term: 夹具
    why: 用于普通中文技术说明时表达生硬，优先使用自然、具体的中文
    suggest: 测试数据、测试环境或测试辅助工具，按实际用途选词
    ok_when: 机械加工中的夹具，或必须准确使用的正式名称
  - term: 账本
    why: 常把数据库记录表或名为 Ledger 的界面列表组件生硬直译为「账本」，让读者误以为是财务记账
    suggest: 指计费统计或事件归集表时写为计费明细表、用量结算表或事件明细表；指普通数据库表或日志时写为操作记录、执行记录；指界面 Ledger 组件时写为列表、表格或直接写组件名 Ledger
    ok_when: 财务记账账本、区块链分布式账本等正式用法
    bad_when: 把普通操作记录表、状态日志或界面列表组件叫成账本
  - term: 门禁
    why: 把检查、流程条件或超时开关叫作门禁，在中文里显得生硬
    suggest: 按原意写为自动检查、合并前检查、本地检查脚本、发布条件，或运行时的拦截条件、超时开关
    ok_when: 指建筑或设备的实体门禁，或必须准确使用的正式名称
  - term: 口径
    aliases:
    - 字段口径
    - 内容口径
    why: 用口径统称定义、范围、校验规则或说法，中文读起来有公文腔；含义明确也优先改写
    suggest: 按原意写为统计范围、计算方式、字段定义、产品规范、计费规则、校验规则、判定标准、验收标准、报错格式或统一说法
    ok_when: 指枪炮或管道等的口径，或必须准确使用的正式名称
  - term: 收敛
    aliases:
    - 收束
    why: 数学、算法及缩小方案范围时可用；常被借来代替汇总结果、更新状态、进入终态或归纳规则
    suggest: 按实际动作写为状态变为某值、进入终态、完成清理、汇总结果、归纳规则或缩小范围
    ok_when: 数学、算法计算或缩小方案范围
    bad_when: 指普通状态更新、数据回写、清理完成或结果汇总
  - term: 对齐
    why: 除界面排版、内存/字节对齐外，常被笼统用来代替保持一致、共用标识、对照比较、兼容支持或沟通确认
    suggest: 按实际动作写为与某某保持一致、共用同一套标识、字段一一对应、按某某做法配置、多环境版本对照、多方同步更新、与某结果相互印证、兼容某格式，或与某方确认/讲清某问题
    ok_when: 界面元素排版对齐、内存/字节对齐，或已明确写出哪两项的具体字段/数值保持一致
    bad_when: 泛泛写「和某方对齐」「版本对齐」「跨层对齐」，看不出是核对、共用标识、对照、改配置还是做兼容
  - term: 真源
    aliases:
    - 唯一真源
    why: 用于普通中文技术说明时表达生硬，优先使用自然、具体的中文
    suggest: 以哪份文件、哪张表或哪个系统为准
    ok_when: 必须准确使用的正式名称
  - term: 冒充
    why: 安全领域的身份冒充是标准用语；用来指责「数据冒充结论」时偏道德化
    suggest: 安全语境保留；其他场景写出把什么当成了什么
    ok_when: 身份冒充、伪造请求等安全语境
  - term: 红线
    why: 训诫隐喻
    suggest: 写出具体禁止项或阈值：哪些字段不能写日志、延迟不能超过多少
    ok_when: 合规或制度文件里的正式说法
  - term: 护栏
    why: 隐喻；常只是上限/约束
    suggest: 写出具体约束：上限、校验规则或拦截条件
    ok_when: 指实体护栏，或前文已写明具体约束
  - term: 感知
    why: 空词
    suggest: 用户看得见什么 / 系统能发现什么
    ok_when: 传感器、感知模型、感知性能（Perceived performance）等技术用法
  - term: 基线
    why: 排版基线与 Web 兼容性 Baseline 是标准术语；日常说明中常把初始数据、对照版本、改动前的代码、标准配置套件或参考标准混叫成基线
    suggest: 按实际意思写为对照版本、改动前的代码/检查结果、标准配置套件、默认监控配置、初始数据、参考标准或历史记录
    ok_when: 文字排版中的基线、Web 平台兼容性基线（MDN Baseline），或前文已明确写明是哪一版的对照标准
    bad_when: 把普通测试基准、改动前的代码、初始数据、历史记录或参考版本笼统叫成基线
  - term: 基座
    why: 空包装
    suggest: 说清是哪一层：底层框架、基础服务或基础模型
    ok_when: 「基座模型」等已有通行说法
  - term: 透传
    why: 用于普通中文技术说明时表达生硬，优先使用自然、具体的中文
    suggest: 原样传递参数、直接转发请求，按实际动作表述
    ok_when: 必须准确使用的正式名称
  - term: 热更
    aliases:
    - 热更新
    why: 不换进程或免重装生效时正当；口语「热更一下」含糊
    suggest: 后端写为不重启进程加载新配置（简短表达可写为热重载或在线重载）；前端开发写为不重装/不刷新页面实时更新样式或代码；客户端写为免重装在线更新资源；若必须重启或重装就直说
    ok_when: 已写明不重启或不重装加载了什么
  - term: 降级
    why: 功能降级、版本降级都是正常技术表达，不能统一解释为关闭功能
    suggest: 保留原意；必要时说明减少哪些服务能力，或退回哪个版本
    ok_when: 已写明降成什么、哪些功能停用
  - term: 权威
    aliases:
    - 权威事实
    why: 常生硬直译英文 authoritative（如「权威状态」「权威进度」），或作无依据的自我背书
    suggest: 指状态或记录时写为正式进度记录、最终生效的状态，或写明以哪份文件/哪张表为准；正式技术名词保留
    ok_when: 权威 DNS（Authoritative DNS）等正式技术名称，或已写明以哪个具体来源为准
  - term: 事实源
    why: 用于普通中文技术说明时表达生硬，优先使用自然、具体的中文
    suggest: 数据来源，或直接写以哪个系统的记录为准
    ok_when: 必须准确使用的正式名称
  - term: 代次
    why: 用于普通中文技术说明时表达生硬，优先使用自然、具体的中文
    suggest: 配置版本、更新批次
    ok_when: 确实需要区分版本与代次的协议或正式字段名称
  - term: 非目标
    why: 用于普通中文技术说明时表达生硬，优先使用自然、具体的中文
    suggest: 本次不做的内容、不在本次范围内
    ok_when: 必须准确使用的正式名称
  - term: 溯源
    why: 英文直译（provenance）
    suggest: 说明来源、追查产生过程，或记录谁在何时修改；事件溯源是专门概念，不简单替换为来源
    ok_when: 已写明查到了哪个来源
  - term: 推进
    why: 常作为万能动词代替继续开发、继续执行或状态流转，动作含糊
    suggest: 指工作或方向时写为继续做、接着改某功能；指程序或任务运行时写为继续执行、依次执行或流转到下一状态
    ok_when: 已写明从哪一步/哪个状态流转到哪一步
    bad_when: 空泛写「继续推进」「推进实现」「往某方向推进」而不说具体动作
  - term: 管控
    why: 听起来像机关，其实是管住别乱来
    suggest: 谁能改、改前要什么审批
    ok_when: 已写明管什么、怎么控
  - term: 矩阵
    why: 常把普通汇总表、多平台/多条件测试组合或网格排列生硬地叫成矩阵
    suggest: 指表格时写为对照表、汇总表或结果表；指多条件测试或构建时写明组合维度（如各系统与架构的构建检查、多页面截图检查）；指排列布局时写为网格或几行几列排列
    ok_when: 数学线性代数中的矩阵，或明确列出「行维度×列维度」的二维交叉表
    bad_when: 把普通列表、筛选表格、全量测试或网格布局笼统叫成矩阵
  - term: 端到端
    why: 常空泛代指整条流程，却不交代起点和终点
    suggest: 写出从哪一步到哪一步（如从点击运行到归档完成的全流程）；指自动化测试时可保留「端到端测试」或写明具体测试工具（如 Playwright 浏览器测试）
    ok_when: 已写明从哪一步到哪一步，或用于「端到端测试」「端到端加密」等固定技术术语
  - term: 一期
    why: 空时间盒；常不说一期边界
    suggest: 第一期只做 A/B；C 放到以后
    ok_when: 已写明这一期包含哪些内容
  - term: 面向
    aliases:
    - 围绕
    why: 常把适用范围、目标方向或重点内容包装成抽象介词短语，表达绕弯
    suggest: 按实意直说：指适用对象写为供某某使用、仅支持某某；指提交或发送方向写为提交到、发往；「围绕某某」写为针对某某目标、重点展开/放大某某
    ok_when: 自然说明产品或文档受众（如「面向外部客户」「面向普通用户」），或明确的网络拓扑朝向（如「面向客户端的入口节点」）
    bad_when: 句首空泛铺垫「面向…，围绕…」，或用「面向某技术/仓库」代替具体动作
  - term: 横切
    why: 英文直译（cross-cutting）
    suggest: 多个模块共用的功能可写为公共功能，如统一记录日志、检查权限；不要把所有情况都替换成中间件
    ok_when: 介绍面向切面编程概念，或必须准确使用的正式名称
  - term: 自行车棚
    why: 英文直译（bikeshedding）
    suggest: 在次要细节上花费过多讨论时间；指实体建筑时保留原义
    ok_when: 指实体建筑
  - term: 快乐路径
    why: 用于普通中文技术说明时表达生硬，优先使用自然、具体的中文
    suggest: 正常流程、一切正常时的处理流程
    ok_when: 必须准确使用的正式名称
  - term: 黄金路径
    why: 用于普通中文技术说明时表达生硬，优先使用自然、具体的中文
    suggest: 推荐流程、默认做法
    ok_when: 必须准确使用的正式名称
  - term: 飞轮
    why: 英文直译（flywheel）
    suggest: 多个环节相互促进的循环；写明哪些环节如何相互促进，机械部件用法保留
    ok_when: 指机械部件，或已写明哪些环节如何相互促进
  - term: 护城河
    why: 英文直译（moat）
    suggest: 竞争对手难以复制的优势；说明具体是技术、成本、渠道还是其他因素，实体用法保留
    ok_when: 指实体护城河，或已说明具体优势
  - term: 驾驶舱
    why: 英文直译（cockpit / exec dashboard）
    suggest: 经营数据总览或管理看板；航空器等实体用法保留
    ok_when: 指航空器、车辆等实体驾驶舱
  - term: 交付物
    why: 英文直译（deliverable）
    suggest: 需要提交的成果，如可运行程序、报告或操作文档；按实际要求列出内容
    ok_when: 后面列出了具体文件或功能
  - term: 控制面
    aliases:
    - 数据面
    - 管理面
    why: 网络与集群架构中区分管理配置与实际流量转发时可用；搬到普通前后端，或用来模糊代指某个具体服务、界面筛选项时会显得绕
    suggest: 指具体组件时直接写服务名（如某配置服务、边缘节点）；指流程或界面分类时写为管理与配置下发、管理后台，或实际处理请求、转发业务/拨测流量的部分
    ok_when: 讨论网络、网关或集群整体架构，且管理配置与实际流量转发的边界清楚
    bad_when: 指普通前后端、常规增删改查接口，或能直接写出具体服务名/流量类型却拿「控制面/数据面/管理面」代替
  - term: 穿透
    why: 管理语境中代指跨层级检查或层层传达，表意生硬
    suggest: 按实意写为直接查到底层明细、跨模块传递参数
    ok_when: 缓存穿透、内网穿透（NAT 穿透）等标准技术术语
    bad_when: 代指跨部门/跨层级管理动作或空泛的「信息穿透」
  - term: 共识
    why: 协作语境中常空喊达成共识而不写商定了什么
    suggest: 写出各方商定一致的具体结论或规则
    ok_when: 分布式系统中的共识算法、共识协议（如 Raft、Paxos）
    bad_when: 只说「对齐共识」「达成共识」而不交代具体定下的内容
  - term: 水位
    aliases:
    - 高水位
    why: 借资源指标代指项目进度、能力水平或团队负荷，属于管理黑话
    suggest: 指进度或状态时写为当前完成进度、现有程度或人员负荷；指系统指标时写明具体指标名（如内存占用峰值、队列堆积量）
    ok_when: 内存/队列高水位线（high-water mark）或已写明具体监控指标
    bad_when: 代指项目进度、完成度、团队状态或能力水平
  - term: 下钻
    aliases:
    - 上卷
    why: 英文直译（drill down / roll up），在非报表专业语境中读起来生硬
    suggest: 下钻写为展开查看明细、进入下一层详情；上卷写为向父级汇总、按上层分组统计，并写明汇总的数值
    ok_when: 讨论多维分析（OLAP）概念本身，或已写明从哪一层展开/汇总到哪一层
    bad_when: 在普通界面或架构说明中生硬代指展开详情或层级汇总
  - term: 信息架构
    why: 常把具体的页面布局、导航跳转或字段取舍笼统拔高为「信息架构」
    suggest: 按实际所指写为页面结构、导航与跳转关系、内容分类，或具体显示哪些字段与文案
    ok_when: 讨论网站或应用的内容分类、信息组织和导航结构的整体设计（MDN 术语 Information Architecture），且已写明具体层级或分类
    bad_when: 把改几个字段、调一行文案或补个跳转链接笼统说成信息架构问题
  - term: 门控
    why: 英文 gating 直译；除数字电路和神经网络外，在普通软件说明中读起来生硬
    suggest: 功能开关场景写为按条件启用、特性开关；并发或流控场景写为等待条件满足、按信号放行或准入检查
    ok_when: 神经网络（如 GRU、MoE 门控网络）或数字电路中的专门术语
    bad_when: 把普通条件判断、功能开关或请求阻塞/放行叫成门控
  - term: 产线
    why: 制造业隐喻，把软件生产环境或正式代码叫成工厂的「产线」
    suggest: 按实意写为生产环境、正式代码或线上服务
    ok_when: 指工厂、制造业中的实体生产线
    bad_when: 指软件项目的正式代码、线上环境或发布分支
  - term: 裁决
    why: 把普通的判断、决定说成法庭式「裁决」，显得夸张；什么决定都叫裁决反而看不出轻重
    suggest: 写为判断结果、决定或结论，并写出依据
    ok_when: 仲裁、司法、比赛裁判或协议中专门定义的裁决机制等正式场景
    bad_when: 把普通的技术判断、方案取舍或条件分支结果说成裁决
  - term: 铁律
    aliases: [铁则]
    why: 训斥口吻；只喊「铁律」却不写具体规则，读者不知道指哪几条
    suggest: 直接列出具体规则，或写为「必须遵守的规则：A、B、C」
    ok_when: 引用文档里已有的正式名称，或前文已列出具体条目
    bad_when: 只喊「铁律和红线」，不写出指哪些规则
  - term: 对拍
    why: 算法竞赛术语（用小数据对比两个程序的输出）；日常工程里常被借来泛指核对或确认，读者看不出在比什么
    suggest: 写为把 A 和 B 的输出逐项对比，或与某方核对并写明比较的内容
    ok_when: 算法竞赛里用暴力程序和正解程序对比输出，且已写明比较对象
    bad_when: 泛指「和某方对拍」，看不出是对比输出还是确认意见
  - term: 归户
    why: 数据治理或电信领域有「按用户归并」的含义；日常常被用来指责任或记录归到谁，读者容易困惑
    suggest: 写清把记录归到哪个账户名下、归入哪个分类，或由谁负责
    ok_when: 数据治理中把记录按用户或账户归并，且说明归并依据
    bad_when: 泛指「已归户」「无主→归户」，没说归给谁
  - term: 漂移
    why: 配置漂移、数据漂移是专门术语；日常汇报里只写「无漂移」，读者看不出是哪两份内容保持一致
    suggest: 写出哪两份内容一致、核对了哪些字段、有没有被改动过
    ok_when: 配置漂移、模型漂移、时钟漂移等标准术语，或已写明什么与什么不一致
    bad_when: 泛指「无漂移」「有漂移」，不写对照对象
  - term: 锚定
    why: 金融与心理学专门术语；日常说明里常借来指「固定到某版本」或「以某条证据为准」，读起来生硬
    suggest: 写为以某份内容为准、固定在某个版本，或根据某条依据得出
    ok_when: 锚定效应、锚定汇率等正式用法
    bad_when: 把「以某份内容为准」「依据某条记录」说成「锚定到…」
  - term: 接住
    why: 英文 catch 的翻译腔；用来指回应情绪、反馈或请求时显得油腻，技术上又容易和异常捕获混淆
    suggest: 回应反馈写为收到、已采纳；异常处理写为捕获并处理；承担任务写为由我来处理
    ok_when: 字面的物理动作，或技术上明确指捕获异常
    bad_when: 接住用户情绪、反馈、请求，或「我都接住」这类泛泛承诺
  - term: 锋利
    why: 英文 sharp 的直译，拿刀刃锋利来形容重构、分析或文字，听起来不自然
    suggest: 具体写出好在哪：更准确、更简单、更能解释现象
    ok_when: 字面指刀具或边缘锋利
    bad_when: 「更锋利的重构 / 分析 / 表述」
  - term: 反直觉
    aliases: [反常识]
    why: 后面接的往往是普通事实，却先贴个标签故意制造反差
    suggest: 写出大家通常以为是什么、实际是什么；如果只是普通事实，直接说
    ok_when: 确与常见预期相反，并写明了预期与实际
    bad_when: 「更反直觉的是」「告诉你一个反常识的内容」后面没有真正的反差
  - term: 背后藏着
    why: 故意制造神秘感，把简单的因果关系说成隐藏内幕
    suggest: 直接写原因：因为 A，所以 B
    ok_when: 引用原文，或确有被隐瞒的信息并写明是什么
    bad_when: 用于普通因果解释，如「背后藏着一个问题」
  - term: 纠正一下
    aliases: [捋清, 捋一下]
    why: 居高临下的说教口吻（把补充说明说成「纠正」），或用「捋清 / 捋一下」作空泛铺垫
    suggest: 直接写正确的说法（实际是…）或直接列出梳理后的步骤；确需更正错误再用「更正：」并写出内容
    ok_when: 确有明显的事实错误需要更正，并写出更正后的内容
    bad_when: 用于普通补充或过渡，如「先纠正一下」「先把逻辑捋一下」之类的铺垫
  - term: 值得注意的是
    aliases: [值得一提的是, 值得强调的是, 需要注意的是, 不得不说的是]
    why: 常见的凑字数过渡词，删掉后句子更紧凑
    suggest: 直接写后面的内容；确是风险或限制，写为「注意：…」并说明具体影响
    ok_when: 后面是读者容易忽略的具体风险、限制或前提，并写出了内容
    bad_when: 后面只是一般性补充，前缀起不到作用
  - term: 归根结底
    aliases: [总而言之, 说白了, 某种程度上, 某种意义上]
    why: 套话式的总结或模糊让步，拖慢节奏，常用来硬凑深度
    suggest: 直接写出结论；有适用前提时写明具体条件（如「在并发较高时」）
    ok_when: 段末确有总结结论，且前文篇幅较长
    bad_when: 一两句话里也加「总而言之」「说白了」，或用「某种程度上」含糊其辞
  - term: 真正重要的是
    aliases: [记住，真正重要的是]
    why: 演讲式煽情句式，先贬低前面的内容再抬高后面的「重点」
    suggest: 直接写重点，必要时说明为什么重要
    ok_when: 确有主次取舍，并给出了理由
    bad_when: 以「记住，真正重要的是」作为段落收尾
  - term: 生态位
    aliases: [价值感]
    why: 商业套话；把产品定位、用户感受笼统说成「生态位 / 价值感」，看不出具体指什么
    suggest: 写清产品给谁用、解决什么问题，或用户具体得到了什么好处
    ok_when: 生态学术语，或已写明具体产品定位、服务对象与用户实际收益
    bad_when: 空泛写「占住生态位」「提升价值感」
  - term: 不能宣称
    aliases: [不能断定, 不能视为, 不足以确认, 不足以证明, 不能证明, 更不能说明, 不能反映, 承认本身并不等于]
    why: 「签合同式」免责：说一句话先叠几层否定，读完还是不知道结果是什么
    suggest: 先说结果（做完了 / 没做完）；有没验证的部分，直接写出还缺什么
    ok_when: 确有未验证部分，并写明缺什么、需要什么才能确认
    bad_when: 对日常事实或显而易见的结论叠加免责声明
  - term: 并不意味着
    aliases: [并不代表, 并不能说明, 这不代表]
    why: 防御性免责句式，常见于「是 A，但这不代表 B，也不意味着 C」连环否定
    suggest: 删掉多余的免责铺垫，直接说结论；如果确实容易引起误会，再点明哪里容易误会
    ok_when: 读者真的容易误读，并写明会被误读成什么
    bad_when: 连续两次以上否定，或对没人会误读的内容加否定
  - term: 复盘
    why: 原指下完棋后重摆棋局；日常里常把普通的「回头检查」「事后总结」都叫复盘，却不说总结什么
    suggest: 事后总结时写清发生了什么、原因和改进办法；只是再看一遍时直接写重新检查
    ok_when: 事故或项目结束后的正式复盘，且后面有按时间线或原因展开的内容
    bad_when: 泛指「复盘一下」「做个复盘」，看不出复盘对象和结论
  - term: 解法
    why: 带做题腔；在工程说明里常用来代替普通的「办法 / 方案」
    suggest: 写为办法、方案或处理方式，并说明具体怎么做
    ok_when: 算法题、数学题的解法，或引用文档中的正式标题
    bad_when: 把工程问题的处理办法叫「解法」
  - term: 回写
    why: 只说「回写」，读者看不出是把什么数据写回到哪张表、哪个字段或哪个文件
    suggest: 写清把什么结果写回哪个字段、哪张表，或把状态更新为什么值
    ok_when: 缓存的 write-back 策略等标准用法，或已写明写回的目标
    bad_when: 泛指「回写一下」，不写目标字段或目标系统
  - term: 阻塞
    aliases: [阻塞项]
    why: 网络和并发里是正常术语；日常汇报里常把「卡住做不下去」都叫阻塞，却不说缺什么
    suggest: 直接写卡在哪一步、还在等什么（如「等后端接口」「缺测试账号，暂时无法继续」）
    ok_when: 线程/IO 阻塞等标准技术用法，或已写明卡在哪一步、在等什么
    bad_when: 只写「有阻塞」「阻塞项 3 个」，不写具体缺什么
  - term: 排空
    aliases: [配置排空]
    why: 英文 drain / draining 直译；用于配置或节点下线时，读者容易误解为「清空配置」或直接删数据
    suggest: 按实意写为旧配置平滑下线、停止接收新流量并等待在途请求处理完再下线
    ok_when: 物理语境排空液体/气体，或已写明「停止接新请求并等在途请求处理完」
    bad_when: 直接写「配置排空」「排空旧节点」而不说明是否等待现有请求结束
  - term: 退役
    aliases: [退休]
    why: 英文 retire / retirement / decommission 直译，且日常汇报常把「退役」「退休」混用，拿人事/军事词代指停用功能或清理缓存
    suggest: 旧功能、旧配置或旧节点写为停用、下线或移除；缓存对象写为逻辑删除、淘汰清理
    ok_when: 军人退役、人员退休或实体设备报废等字面用法
    bad_when: 把停用接口、下线配置或清理缓存对象说成「退役」「退休」
  - term: 有界
    why: 英文 bounded 直译（如 bounded merge）；在普通中文技术说明里偏书面生硬
    suggest: 按实意写为限制数量上限、设上限的、带容量上限的（并写明上限值）
    ok_when: 数学与算法中的「有界函数」「有界队列」等正式术语
    bad_when: 在普通功能说明里写「有界合并」「有界处理」而不直接写明上限
  - term: 影子
    aliases: [影子规则]
    why: 英文 shadow 直译（如 shadow rules）；离开具体说明时，读者分不清是并行试运行的副本、测试规则还是待删的旧版冗余规则
    suggest: 按实际用途写为并行测试规则、试运行副本、对照环境或旧版冗余规则
    ok_when: 字面影子、界面阴影，或使用「影子流量」等已解释的标准术语
    bad_when: 只写「影子规则」「跑了一套影子」而不说明是否真实生效或是否影响线上数据
  - term: 操作面
    aliases: [演示面]
    why: 英文 operator surface / demo surface 中 surface 的直译；在中文里把界面或功能范围叫成「……面」显得生硬
    suggest: 按实意写为运维操作界面、管理功能、可演示的功能范围或对外暴露的接口
    ok_when: 机械加工或物理设备的实体操作面
    bad_when: 把运维后台、命令行工具或可演示的功能范围叫成「操作面」「演示面」
  - term: 底座
    why: 英文 foundation / base / substrate 直译（与「基座」同类），空泛包装底层模块，看不出具体是哪一层
    suggest: 写明具体层次或组件：基础框架、底层模块、基础设施或公共运行环境
    ok_when: 字面指硬件或物体的实体底座
    bad_when: 把基础框架、底层模块或公共服务统称为「技术底座」「能力底座」
  - term: 双轨
    why: 英文 dual-track 直译；常只说「双轨运行」却不说明哪两套方案并行、各自负责什么、何时切换
    suggest: 写为新旧两套方案并行、同时支持两种方式，并写明各自的适用范围与切换时机
    ok_when: 铁路双轨等字面用法，或已写明并行哪两套具体方案及切换条件
    bad_when: 只说「先双轨」「双轨推进」而不写并行了哪两套方案
  - term: 一跳
    why: 英文 one hop 直译；把网络路由术语「跳数」泛化为项目阶段或操作步骤，非网络语境下显得生硬
    suggest: 非网络语境写为这一步、下一阶段、一个步骤或一次跳转
    ok_when: 网络路由中的一跳（one hop）、单跳转发等标准网络术语
    bad_when: 把项目里程碑、页面操作或工作流程里的下一步说成「一跳」
  - term: 大头
    aliases: [大头解码]
    why: 英文 large header / oversized header 压缩直译；在 HTTP/网络语境下用来指超大响应头或请求头，极易与日常「占大头」混淆
    suggest: 写全为超大响应头、超大请求头（如「超大 HTTP 响应头解码」）
    ok_when: 日常口语指占比最大的部分（如「内存占用里图片占大头」）
    bad_when: 把超大 HTTP 请求头/响应头（large header）简称为「大头」或「大头解码」
  - term: 纸面配置
    why: 英文 paper config / on-paper 直译；用来指仅写在文档里、尚未在环境中实际生效的配置
    suggest: 写为仅停留在文档中的配置、尚未实际部署生效的配置
    ok_when: 字面指纸质配置文件，或前文已解释其指未生效的文档配置
    bad_when: 只写「纸面配置」而不说明是否已写入系统或实际生效
  - term: 出边
    why: 电报体压缩词，在网络与代理语境下代指「出站流量 / 出口节点」，容易和图论里的「出边」混淆
    suggest: 网络与代理场景写为出站流量、出口节点或对外访问规则
    ok_when: 图论与数据结构中指有向图的出边
    bad_when: 把出站流量、出口节点或对外转发规则简称为「出边」
  - term: 结转
    why: 财务会计术语，被借来指昨日未完成、顺延到今日的研发任务，在日常汇报里显得生硬
    suggest: 研发任务场景写为昨日未完成、顺延至今日继续处理的事项
    ok_when: 财务、会计核算中的科目结转、余额结转等正式用法
    bad_when: 把跨天顺延的研发任务或遗留待办说成「结转」
  - term: 对数
    aliases: [看数]
    why: 把核对统计数据、查看监控指标压缩成「对数 / 看数」，前者还容易与数学里的「对数（logarithm）」混淆
    suggest: 写全为核对统计数据、比对两张表的数值，或查看监控指标/报表数据
    ok_when: 数学与算法中的对数（logarithm，如对数时间复杂度）
    bad_when: 把核对数据、查报表或看监控指标简称为「对数」「看数」
  - term: 门闩
    aliases: [闸门, 开闸]
    why: 借实体门窗或水利设施隐喻防误操作开关、发布前检查或放开流量限制，在软件说明里读起来生硬
    suggest: 按实意写为防误操作确认开关、上线前检查、限流开关或放开限制/开始放量
    ok_when: 实体门闩/闸门，或并发编程中明确指 CountDownLatch（倒计时门闩）
    bad_when: 把普通二次确认、发布审批或放开限流叫成「门闩」「闸门」「开闸」
  - term: 车队
    aliases: [机队]
    why: 借交通/航空术语（部分受英文 fleet 直译影响）代指服务器集群或节点集合，在普通技术说明里显得生硬
    suggest: 直接写服务器集群、节点列表、在线实例或设备组
    ok_when: 物流车队、航空机队等字面用法
    bad_when: 把服务器集群、边缘节点或测试设备池叫成「车队」「机队」
  - term: 盖章
    why: 借公文盖章隐喻审批通过或确认验收，日常技术沟通里带官僚味
    suggest: 写为确认通过、审批同意或完成验收
    ok_when: 实体合同、公文盖章或电子签章等字面用法
    bad_when: 把代码评审通过、测试验收确认说成「盖章」
  - term: 分家
    why: 借家庭分产隐喻把一个模块、仓库或服务拆分成两个独立部分，看不出拆分边界
    suggest: 写为拆分为独立的模块、服务或仓库，并写明各自负责的内容
    ok_when: 字面指家庭分家
    bad_when: 用「分家」代指代码、配置或服务拆分而不写拆分边界
  - term: 收官
    why: 借围棋与汇报套话表示进入收尾阶段，常用来笼统表态却不说还剩什么没做完
    suggest: 写为进入收尾阶段、完成最后几项任务，并列出剩余事项
    ok_when: 围棋对局的收官阶段，或大型活动正式闭幕
    bad_when: 只写「本周收官」「收官阶段」而不列出具体剩余工作
  - term: 复活
    why: 游戏隐喻，用来指重启已停止的服务、恢复故障节点或重新打开已关闭的工单/分支，表意不够准确
    suggest: 按实意写为重启服务、节点恢复在线、重新启用功能或重新打开某工单
    ok_when: 游戏机制或文学作品中的字面复活
    bad_when: 用「复活」代替服务重启、故障恢复或重新打开问题单
  - term: 松动
    why: 物理隐喻，用来指阻塞条件缓解、限制放宽或态度转变，只说「有松动」看不出具体变化
    suggest: 直接写出哪个限制放宽了、哪项阻塞有了进展或对方同意了哪一点
    ok_when: 螺丝、部件等物理结构的松动
    bad_when: 泛指「排期有松动」「卡点松动」而不说明具体变化
  - term: 落差
    why: 借地形高差或心理落差代指预期与实际、两个环境或两个版本之间的差异，不如直接说差距或差异
    suggest: 写为与预期的差异、两个环境之间的差距，并给出具体对比项或数值
    ok_when: 物理地形水位落差，或明确的心理落差
    bad_when: 用「落差」代指接口行为差异、配置不一致或指标差距
  - term: 入库
    aliases: [上库]
    why: 存在「代码合入仓库」与「数据写入数据库」双重歧义，读者需要猜具体指哪一种
    suggest: 代码合入写为合入代码仓库（或合入 main 分支）；数据保存写为写入数据库（并写明哪张表）
    ok_when: 仓储物流入库，或上下文已明确写清是「写入某数据库表」还是「代码合入某仓库」
    bad_when: 只写「已入库」「准备上库」，看不出是代码提交还是数据落表
  - term: 落点
    why: 借物理落点代指代码归属模块、实现位置或触发入口，读者看不出具体落在哪个文件或模块
    suggest: 直接写出具体的模块名、文件路径、函数入口或归属服务
    ok_when: 体育球类或物理抛物线的落点等字面用法
    bad_when: 泛指「找好落点」「落点未定」而不写明具体模块或位置
  - term: 进主线
    why: 把代码合入主分支说成「进主线」，偏口语且未写明具体分支名
    suggest: 写为合入主分支（如 main 分支）
    ok_when: 游戏或叙事语境里的进入主线剧情
    bad_when: 在代码协作说明里代替「合入 main 分支」
  - term: 可跑形状
    why: 生造工程口语，用「形状」代指代码或环境已具备可运行的基本条件，读起来怪异
    suggest: 写为已可运行、具备基本运行条件或跑通最小可用版本
    ok_when: 引用原文或非技术语境字面表述
    bad_when: 用来代指代码或环境已具备可运行的基本状态
  - term: 串链验收
    why: 工程切口，把跨模块/跨服务的端到端联调验收压缩成四字黑话
    suggest: 写为端到端联调验收，并写明从哪一步串到哪一步
    ok_when: 已紧接着写明串联了哪几个具体环节与验收标准
    bad_when: 只写「完成串链验收」，看不出联调了哪些模块
  - term: 走真管道
    why: 工程口语，用「真管道」代指使用真实数据通道、真实接口或真实环境（而非 mock）
    suggest: 写为使用真实数据通道、调用真实接口或在真实环境中执行
    ok_when: 字面指实体管道
    bad_when: 用来代指接入真实接口、真实队列或真实数据流
  - term: 绿线
    why: 借色彩隐喻代指正常通过的路径、核心主流程或健康基线，非团队内部人士看不懂
    suggest: 按实意写为正常通过的路径、核心主流程或预期正常状态
    ok_when: 图表、地图或地铁线路中字面指绿色线条或绿线
    bad_when: 用「绿线」代指正常业务流程或测试通过路径
  3:
  - term: 可观测
    aliases:
    - 可观测性
    why: 正当主题词；清单项里常空转
    suggest: 具体要看哪些日志、指标或告警
  - term: 正交
    why: 借数学术语
    suggest: 互相独立、互不影响（改一个不会牵动另一个）
  - term: 防腐层
    why: 用于普通中文技术说明时表达生硬，优先使用自然、具体的中文
    suggest: 外部系统适配层；必要时解释它如何转换外部数据
    ok_when: 介绍领域驱动设计的这个模式，或必须准确使用的正式名称
  - term: 通用语言
    why: 英文直译（ubiquitous language）
    suggest: 团队内部统一使用的业务术语（仅限团队内约定，并非行业通用叫法）
  - term: 物化
    why: 英文直译（materialize）
    suggest: 数据库中可解释为将查询结果预先计算并保存（物化视图可保留）；非数据库语境若指异步落盘或实际执行删除，可直接写出具体动作（如实际删除文件、生成物理文件）
  - term: 门面
    why: 英文直译（facade）
    suggest: 设计模式中解释为对外提供统一调用入口，隐藏内部调用细节；外观用于界面样式时保留原义
  - term: 南北向
    aliases:
    - 东西向
    why: 英文直译（N-S / E-W traffic）
    suggest: 按实际网络边界写为进出集群的流量；东西向写为集群内服务之间的流量，不固定限定为数据中心
  - term: 代码异味
    aliases:
    - 坏味道
    why: 用于普通中文技术说明时表达生硬，优先使用自然、具体的中文
    suggest: 可能存在的设计问题，或直接指出重复代码、依赖混乱等具体问题
    ok_when: 讨论 code smell 术语本身或引用正式名称
  - term: 银弹
    why: 英文直译（silver bullet）
    suggest: 万能办法；「没有银弹」即「没有适用于所有情况的解决办法」
  - term: 大泥球
    why: 英文直译（big ball of mud）
    suggest: 模块职责和依赖混杂的系统；最好指出具体哪些模块相互依赖或难以单独修改
  - term: 童子军规则
    why: 英文直译（boy scout rule）
    suggest: 修改代码时顺手改善附近的小问题；不要扩大为每次都要重构整个模块
  - term: 黑暗发布
    why: 用于普通中文技术说明时表达生硬，优先使用自然、具体的中文
    suggest: 功能已部署但暂不向用户开放
    ok_when: 必须准确使用的正式名称
  - term: 影子流量
    why: 英文直译（shadow traffic）
    suggest: 把真实请求复制一份发给测试版本来观察表现（注意确认是否会触发真实的写入或副作用）
  - term: 背压
    why: 英文直译（backpressure）
    suggest: 下游处理不过来时，让上游减慢发送速度或暂停发送；说明由谁通知、限制哪一段流量
  - term: 扇出
    aliases:
    - 扇入
    why: 英文直译（fan-out / fan-in）
    suggest: 请求处理中，扇出指把一次请求分发给多个下游，扇入指汇集多个结果；代码与模块依赖分析中，扇入指被多少模块/文件依赖或调用，扇出指依赖或调用了多少其他模块/文件
  - term: 惊群
    why: 英文直译（thundering herd）
    suggest: 多个等待者同时被唤醒并争抢同一资源；说明具体等待的是连接、锁还是其他事件
  - term: 脑裂
    why: 英文直译（split brain）
    suggest: 集群失去正常协调后，多个节点同时以主节点身份工作；说明实际影响，避免只说分成两派
  - term: 热路径
    why: 英文直译（hot path）
    suggest: 执行最频繁的代码或请求流程，必要时直接指出是哪个函数
  - term: 韧性
    why: 英文直译（resilience）
    suggest: 系统遇到故障时维持必要功能并恢复服务的能力；需要时说明如何隔离故障、重试或恢复
  - term: 粘性会话
    why: 英文直译（sticky session）
    suggest: 把同一会话的请求尽量分给同一个后端实例处理（并非永久绑定）
  - term: 亲和性
    why: 英文直译（affinity）
    suggest: 按对象解释：任务优先安排到指定节点，或请求优先发给某实例；说明是优先选择还是强制要求
  - term: 死信
    why: 英文直译（dead letter）
    suggest: 因为过期、拒收或重试耗尽等原因，无法正常处理而被转入专门队列的消息
  - term: 毒消息
    why: 英文直译（poison message）
    suggest: 因内容或格式有问题而一直处理失败的消息（不一定会导致进程崩溃）
  - term: 刷盘
    why: 英文直译（flush）
    suggest: 把缓冲区里的数据写入文件或磁盘（只有确认落盘策略时才能保证断电不丢）
  - term: 驱逐
    why: 英文直译（evict）
    suggest: 缓存场景写为移除缓存项；调度场景写为移走或终止实例；淘汰用于普通筛选时保留原义
  - term: 预取
    why: 性能与缓存标准术语（MDN Prefetch）；读者可能不清楚提前读取了什么、存到哪里
    suggest: 可保留术语；读者可能不熟时补一句说明：在实际需要前于后台提前读取数据或资源，并写明读到缓存还是内存
  - term: 水合
    why: 用于普通中文技术说明时表达生硬，优先使用自然、具体的中文
    suggest: 前端场景写为给服务端生成的页面绑定事件并启用交互；其他场景按实际含义说明
    ok_when: 化学中的水合，或必须准确使用的正式名称
  - term: 可发现性
    why: 英文直译（discoverability）
    suggest: 用户是否容易找到某个功能或入口；按需要说明入口位置和提示方式
  - term: 渐进增强
    why: Web 前端设计术语（MDN Progressive Enhancement）；非前端读者可能不熟悉其具体做法
    suggest: 可保留术语；首次出现按需补一句说明：先确保所有环境都能使用基本功能，再为支持的浏览器提供更丰富的体验
  - term: 优雅降级
    why: Web 前端设计术语（MDN Graceful degradation）；非前端读者可能不熟悉其具体策略（同时防止被「降级」子串误伤）
    suggest: 可保留术语；首次出现按需补一句说明：先按现代环境实现完整体验，并在旧环境或能力受限时保留必要的基本功能
  - term: 感知性能
    why: Web 性能标准术语（MDN Perceived performance）；读者可能分不清主观感受与真实加载耗时（同时防止被「感知」子串误伤）
    suggest: 可保留术语；首次出现按需补一句说明：指用户主观感受到的页面打开与响应速度，例如用骨架屏或乐观更新改善体验
  - term: 摇树优化
    why: 前端构建术语（MDN Tree shaking）；字面意思不直观，非前端读者不易理解
    suggest: 可保留术语；首次出现按需补一句说明：打包构建时自动剔除未被引用的多余代码
  - term: 防抖
    why: 前端与交互术语（MDN Debounce）；名称高度缩写，容易与「节流」混淆
    suggest: 可保留术语；读者可能不熟时补一句说明：连续触发时只执行最后一次（等停止操作一段时间后再触发），避免与「节流」混淆
  - term: 节流
    why: 前端与网络术语（MDN Throttle）；不同语境含义不同，容易与「防抖」混淆
    suggest: 可保留术语；按语境补一句说明：交互事件中指固定时间间隔内最多执行一次；网络或资源控制中指限制请求频率或带宽占用
  - term: 队头阻塞
    why: 网络传输术语（MDN Head-of-line blocking）；偏底层，非网络方向读者可能不明白阻塞原因
    suggest: 可保留术语；必要时补一句说明：排在前面的请求或数据包未完成，导致后面已就绪的数据也被卡住等待
  - term: 预检请求
    why: HTTP/跨域安全术语（MDN Preflight request）；非 Web 安全读者可能不理解为何多出一次 OPTIONS 请求
    suggest: 可保留术语；读者可能不熟时补一句说明：浏览器在发送正式跨域请求前，先发一次 OPTIONS 请求确认服务器是否允许
  - term: 层叠上下文
    why: CSS 渲染术语（MDN Stacking context）；只写术语时读者往往不明白为何 z-index 不按预期生效
    suggest: 可保留术语；排障或说明样式时按需补一句说明：决定元素在前后遮挡层级（z 轴）排序的独立渲染作用域
  - term: 垫片
    why: 软件兼容术语（MDN Shim）；借机械零件指代兼容代码，读者可能不清楚具体适配了什么
    suggest: 可保留术语；首次出现按需写明是为兼容旧环境、不同平台或不同接口而补充的适配代码
  - term: 着陆页
    aliases:
    - 落地页
    why: 英文直译（landing page）
    suggest: 营销场景指用户点击广告、搜索结果或外部链接后进入的页面（可直接写活动页或产品介绍页）；软件界面中指打开应用或页面时默认显示的初始视图/首页
  - term: 心智模型
    why: 英文直译（mental model）
    suggest: 用户对系统如何运作的理解和预期；直接说明用户以为某个操作会产生什么结果
  - term: 北极星指标
    why: 英文直译（north star metric）
    suggest: 最能代表产品核心用户价值的主要指标；说明具体指标和选择理由，不默认等于收入或使用次数
  - term: 增长黑客
    why: 英文直译（growth hacking）
    suggest: 通过低成本试错和实验来寻找用户增长的方法（具体效果需看实验数据）
  - term: 早期采用者
    why: 英文直译（early adopter）
    suggest: 最早一批开始使用新产品的用户
  - term: 圈选
    aliases:
    - 分群
    why: 英文直译（audience / segment）
    suggest: 圈选写为按条件选出用户；分群写为按特征将用户分组，区分选取与分组
  - term: 渗透率
    why: 英文直译（penetration）
    suggest: 目标人群中使用某产品的比例；补充分母、时间范围和使用标准，不统一理解为曾经用过
  - term: 史诗
    why: 英文直译（epic）
    suggest: 敏捷开发中可解释为需要拆成多个任务的大项需求；文学语境保留
  - term: 故事点
    why: 英文直译（story point）
    suggest: 团队用于估算任务相对工作量或复杂程度的点数；不直接换算为小时或人数
  - term: 燃尽
    why: 英文直译（burndown）
    suggest: 燃尽图即「剩余工作量随时间变化的图表」
  - term: 时间盒
    why: 用于普通中文技术说明时表达生硬，优先使用自然、具体的中文
    suggest: 限定时长、到时结束
    ok_when: 介绍 timebox 方法的正式术语
  - term: 完成定义
    why: 用于普通中文技术说明时表达生硬，优先使用自然、具体的中文
    suggest: 完成标准、怎样才算完成
    ok_when: 介绍敏捷开发中的 Definition of Done 正式术语
  - term: 准备就绪定义
    why: 用于普通中文技术说明时表达生硬，优先使用自然、具体的中文
    suggest: 开始条件、开始前需要满足的条件
    ok_when: 介绍敏捷开发中的 Definition of Ready 正式术语
  - term: 测试替身
    why: 英文直译（test double）
    suggest: 测试中用来代替真实依赖的对象或实现；解释其用途，不要求读者先懂 mock、stub 等英文
  - term: 纵深防御
    why: 英文直译（defense in depth）
    suggest: 设置多层防护，降低某一层失效后的风险；按实际方案说明有哪些防护
  - term: 攻击面
    why: 英文直译（attack surface）
    suggest: 可能被攻击者利用的接口、服务或其他入口；说明实际暴露的部分
  - term: 信任边界
    why: 英文直译（trust boundary）
    suggest: 数据或请求跨越后需要重新验证身份、权限或内容的边界；说明是哪两个系统或区域之间
  - term: 横向移动
    why: 英文直译（lateral movement）
    suggest: 攻击者控制一个节点后，顺势去访问或控制内网里的其他节点
  - term: 探针
    why: 运维与监控术语（存活探针、就绪探针、APM 探针）；被借来泛指普通检查脚本时，非运维读者不易明白
    suggest: 可保留术语；首次出现按需补一句说明：定期向目标发请求或读取状态，用来检查服务是否正常的小程序
  - term: 面包屑
    why: UI 导航标准术语（breadcrumb）；在页面导航之外被借来指线索、路径，容易让人误解
    suggest: 可保留 UI 导航术语；首次出现按需说明：页面顶部的层级路径导航；非导航场景写为线索或调用路径并写明起止
  - term: 幂等
    why: 计算机常用术语，但对非技术读者不直观；有时只写「保证幂等」却没说针对哪个操作
    suggest: 可保留术语；首次出现按需补一句说明：同一个请求重复执行多次，结果和执行一次一样，可以安全重试
  - term: 快照
    why: 常用术语（snapshot）；但如果只写「保存快照」，读者看不出保存的是文件副本、数据库状态还是界面截图
    suggest: 可保留术语；首次出现按需写明快照的对象：某时刻的数据库状态、文件副本或界面截图
  - term: 哈希
    why: 常用术语（hash）；在汇报里常只写「校验哈希值」，没说校验什么、为了确认什么
    suggest: 可保留术语；首次出现按需补一句说明：用数据或文件内容算出的一串固定长度的指纹，用来确认内容有没有改动
  - term: 死锁
    why: 并发编程常用术语；有时被随口用来指普通的「程序卡住了」，容易让人误以为一定是两个任务互相等待
    suggest: 可保留术语；首次出现按需补一句说明：两个及以上任务各占着对方需要的资源，互相等待，都无法继续
