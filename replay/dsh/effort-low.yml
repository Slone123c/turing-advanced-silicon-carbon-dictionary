# 用桌面版的 DeepSeek 账号登录态（headless 默认关闭这几个插件）
- id: authorization
  disabled: false
- id: deepseek-account
  disabled: false
  config:
    desktopPlatform: darwin
- id: credentials
  disabled: false
- id: agent-default-model
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: low
